name: Weekly leaf blast risk (Monday ~7am AET email)

# GitHub cron is UTC only, and eastern-Australia clocks shift an hour at daylight
# saving. Two schedules bracket the change and the gate job lets only the one
# matching the current offset proceed.
on:
  schedule:
    - cron: '30 20 * * 0'   # 06:30 Monday AEST (winter, UTC+10)
    - cron: '30 19 * * 0'   # 06:30 Monday AEDT (summer, UTC+11)
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Override the run date (YYYY-MM-DD). Leave blank for today in Sydney.'
        required: false
        default: ''

permissions:
  contents: write

# Two runs must never write the weather cache at once.
concurrency:
  group: blast-grid
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger; running."
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Match the schedule that fired against the current UTC offset rather
          # than against the local hour. GitHub cron routinely fires 5 to 30
          # minutes late, and an hour check ("is it 06?") silently skipped the
          # entire week whenever a run started at 07:0x local.
          OFF=$(TZ=Australia/Sydney date +%z)     # +1000 (AEST) or +1100 (AEDT)
          SCHED='${{ github.event.schedule }}'
          echo "Offset $OFF, schedule '$SCHED'"
          if { [ "$OFF" = "+1000" ] && [ "$SCHED" = "30 20 * * 0" ]; } || \
             { [ "$OFF" = "+1100" ] && [ "$SCHED" = "30 19 * * 0" ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The other seasonal cron handles this offset."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

  blast:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # Must exceed GRID_MAX_MINUTES (200) plus GRID_RESERVE_MINUTES (25) plus the
    # town run's TOWN_QUOTA_WAIT_MAX_MIN (10) with room to commit and email, so
    # the scripts' own graceful stops fire first and the run still saves.
    timeout-minutes: 255
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ONE RUN DATE FOR THE WHOLE JOB.
      #
      # This is the fix for the 2026-07-30 email, which carried maps titled
      # "weather to 2026-07-23" beside body text saying "weather to 24 Jul 2026".
      # The grid script took its window from Sys.Date() before a two hour fetch
      # and its run_tag from a second Sys.Date() after it, then the town script
      # started on the far side of local midnight and took a third. Pinning the
      # date here and exporting it makes all three impossible.
      #
      # The UTC date is pinned alongside it. The archive's availability follows
      # the UTC clock, and this job fires at ~22:30 UTC on SUNDAY: "Sydney Monday
      # minus 6" was only five days behind the archive and that day was not there
      # yet, so every cell west of 120 E landed a day short on every scheduled
      # run. blast_data_end() counts the lag from the earlier of the two dates.
      # Pinned here for the same reason as the run date: the grid run crosses
      # 00:00 UTC and the town script must see the same date the grid script did.
      - name: Resolve run date
        run: |
          RD="${{ github.event.inputs.run_date }}"
          [ -z "$RD" ] && RD=$(TZ=Australia/Sydney date +%F)
          UD=$(date -u +%F)
          echo "BLAST_RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "BLAST_UTC_DATE=$UD" >> "$GITHUB_ENV"
          echo "Run date pinned to $RD (Australia/Sydney); UTC date $UD"
          # The previous run's verdict is committed; clear it so the Verdict
          # step below cannot mistake last week's health for this week's.
          rm -f blast_outputs/run_status.txt

      - name: Install extra R packages
        run: |
          # curl is required: openmeteo_batch.R needs real HTTP status codes,
          # which jsonlite::fromJSON(url) cannot expose.
          pkgs <- c("data.table", "jsonlite", "curl", "terra")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      # send_email.py is executed by the offline suite in dry-run mode, so the
      # interpreter has to exist BEFORE the tests, not only at send time. The
      # 2026-09-28 email was sent and the step still failed, on a NameError in the
      # line after the send: nothing had ever run the script before the live run.
      - name: Ensure python3
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 --version

      # Offline regression tests: no network, no quota, a few seconds. Fails the
      # run before three hours of fetching are spent on broken code. terra is
      # attached inside the suite on purpose: terra::shift masks
      # data.table::shift, and that masking once turned every grid point into a
      # silent "empty" and produced a blank map with no error in the log.
      #
      # A MISSING file is a warning, not a failure: tests that fail should block
      # the run, but the absence of a test file should never stop the product.
      - name: Offline tests
        run: |
          if [ -f test_offline.R ]; then
            Rscript test_offline.R
          elif [ -f tests/test_offline.R ]; then
            Rscript tests/test_offline.R
          else
            echo "::warning::test_offline.R not found; skipping offline tests"
          fi

      - name: Continental heatmaps
        run: Rscript run_blast_grid.R

      - name: Site table and summary
        run: Rscript run_blast.R

      # Commit the cache FIRST, and never let a missing optional file abort the
      # step. `run:` uses bash -e, so a `git add` on a path that does not exist
      # used to abort before `git push`, losing the cache as well as the trends.
      - name: Commit cache and trends
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          for f in weather_cache.csv.gz weather_cache.csv fetch_failures.csv \
                   cache_version.txt weighted_spend.csv; do
            [ -f "blast_outputs/$f" ] && git add -f "blast_outputs/$f" || true
          done
          for f in town_trends.csv blastam_trends.csv run_log.csv map_stats.txt \
                   midweek_status.txt run_date.txt run_status.txt; do
            [ -f "blast_outputs/$f" ] && git add -f "blast_outputs/$f" || true
          done
          git add -u blast_outputs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Weekly run (cache + trends) ${BLAST_RUN_DATE}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            for i in 1 2 3; do git push && break || sleep $((i*10)); done
          fi

      # Email via a Python stdlib script rather than a JavaScript action: the
      # send-mail action broke when GitHub forced actions onto Node 24.
      - name: Email summary and heatmaps
        if: env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 send_email.py

      # Fallback copy of everything kept for 90 days, in case an email fails.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 90

      # FAIL LOUDLY, LAST. Everything above has already been committed, emailed
      # and uploaded; this step only decides the colour of the run. run_blast.R
      # writes run_status.txt with degraded=0/1 and the reasons (run_health.R);
      # a missing file, or one from another run date, means the town step never
      # finished. A red run makes GitHub notify the workflow's owner, on top of
      # the "[DEGRADED]" subject line. The 2026-09-07 run delivered 31 towns of
      # "no data" and the next two a map three weeks stale, and all three showed
      # a green tick.
      - name: Verdict
        if: always()
        run: |
          f=blast_outputs/run_status.txt
          if [ ! -f "$f" ]; then
            echo "::error title=Blast run did not finish::$f is missing: run_blast.R did not complete"
            exit 1
          fi
          cat "$f"
          if ! grep -q "^run_date=${BLAST_RUN_DATE}$" "$f"; then
            echo "::error title=Blast run did not finish::$f is from another run date"
            exit 1
          fi
          if grep -q '^degraded=1' "$f"; then
            echo "::error title=Degraded blast run::$(grep '^reasons=' "$f" | cut -d= -f2-)"
            exit 1
          fi
          w=$(grep '^warnings=' "$f" | cut -d= -f2-)
          if [ -n "$w" ]; then echo "::warning title=Blast run notes::$w"; fi
          echo "Healthy run."
