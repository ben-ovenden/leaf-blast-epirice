name: Weekly leaf blast risk

on:
  schedule:
    # 06:00 Monday AEST (UTC+10) = 20:00 Sunday UTC. Queensland sites stay on AEST
    # all year (no daylight saving), so this is 6am there every Monday.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blast:
    runs-on: ubuntu-latest
    # Job-level env so the email step's `if:` can read it (a step cannot read its
    # own step-level env in its own `if:`).
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built,
    # so nothing spatial has to compile on the runner.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extra R packages
        run: |
          pkgs <- c("data.table", "jsonlite")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      - name: Site table and summary
        run: Rscript run_blast.R

      - name: Continental heatmap
        run: Rscript run_blast_grid.R

      - name: Set run date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      # Optional email. Add secrets MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO.
      # Placed before the commit so a git hiccup cannot block delivery.
      - name: Email summary and heatmap
        if: ${{ env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Weekly leaf blast risk ${{ env.RUN_DATE }}
          to: ${{ secrets.MAIL_TO }}
          from: Leaf blast model <${{ secrets.MAIL_USERNAME }}>
          body: file://blast_outputs/blast_summary_latest.txt
          attachments: blast_outputs/blast_heatmap_${{ env.RUN_DATE }}.png,blast_outputs/town_trends.csv

      - name: Commit trends history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add -f blast_outputs/town_trends.csv
          git diff --staged --quiet || git commit -m "Town blast trends $(date +%F)"
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 30
