name: Weekly leaf blast risk (Monday afternoon AET email)

# ONE cron, in UTC, on MONDAY.
#
# The map can only be as new as the ERA5 archive, and the archive publishes one
# more day at about 00:30 to 01:00 UTC (measured: not yet there at 00:08 and
# 00:11 UTC on 2 October 2026; a run that began at 00:26 UTC on 25 August caught
# it a few minutes in; every run from 05:09 UTC on had it). Running once that day
# is out makes the map ONE DAY NEWER than the old Sunday-UTC schedule could:
# weather to the previous Monday, seven days before the email, not eight.
#
# So this fires at 00:47 UTC Monday (10:47 AEST, 11:47 AEDT) and the "Resolve
# archive edge" step then ASKS the archive what it has, waiting up to
# ARCHIVE_EDGE_WAIT_MAX_MIN for the new day. The run takes about 2 h 05 and
# GitHub fires schedules anything from minutes to hours late, so expect the email
# early to mid afternoon. The price of the extra day is the morning delivery.
#
# The constraint is in UTC, so daylight saving no longer matters: the two
# seasonal crons and the gate job that chose between them are gone.
on:
  schedule:
    - cron: '47 0 * * 1'   # 00:47 UTC Monday = 10:47 AEST / 11:47 AEDT
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Override the run date (YYYY-MM-DD). Leave blank for today in Sydney.'
        required: false
        default: ''

permissions:
  contents: write

# Two runs must never write the weather cache at once.
concurrency:
  group: blast-grid
  cancel-in-progress: false

jobs:
  blast:
    runs-on: ubuntu-latest
    # Must exceed ARCHIVE_EDGE_WAIT_MAX_MIN (90) plus GRID_MAX_MINUTES (200) plus
    # GRID_RESERVE_MINUTES (25) plus the town run's TOWN_QUOTA_WAIT_MAX_MIN (10)
    # with room to commit and email, so the scripts' own graceful stops fire first
    # and the run still saves. The hosted-runner ceiling is 360.
    timeout-minutes: 345
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ONE RUN DATE FOR THE WHOLE JOB.
      #
      # This is the fix for the 2026-07-30 email, which carried maps titled
      # "weather to 2026-07-23" beside body text saying "weather to 24 Jul 2026".
      # The grid script took its window from Sys.Date() before a two hour fetch
      # and its run_tag from a second Sys.Date() after it, then the town script
      # started on the far side of local midnight and took a third. Pinning the
      # date here and exporting it makes all three impossible.
      #
      # The UTC date is pinned alongside it: the archive's availability follows
      # the UTC clock, and blast_data_end() counts the lag from the earlier of the
      # two dates. On the scheduled run they are now the same day.
      - name: Resolve run date
        run: |
          RD="${{ github.event.inputs.run_date }}"
          [ -z "$RD" ] && RD=$(TZ=Australia/Sydney date +%F)
          UD=$(date -u +%F)
          echo "BLAST_RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "BLAST_UTC_DATE=$UD" >> "$GITHUB_ENV"
          echo "Run date pinned to $RD (Australia/Sydney); UTC date $UD"
          # The previous run's verdict is committed; clear it so the Verdict
          # step below cannot mistake last week's health for this week's.
          rm -f blast_outputs/run_status.txt

      # THE WEATHER CACHE LIVES ON ITS OWN BRANCH, `cache-data`: one parentless
      # commit, replaced on every run. It used to be committed to main, and git
      # keeps every version of a file: 38 runs had put 104 MB of old caches into
      # the history, and three runs a week would add about a gigabyte a year. No
      # model reads weather older than the crop window, so nothing is lost by not
      # keeping the old versions.
      #
      # Restoring it is NOT optional. A run that carried on with an empty cache
      # would spend about twelve fetch days rebuilding the grid, and would then
      # overwrite the good cache with its fragment.
      - name: Restore weather cache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p blast_outputs
          ok=0
          for i in 1 2 3; do
            if git fetch --no-tags --depth 1 origin cache-data; then ok=1; break; fi
            sleep $((i*10))
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=Weather cache not restored::could not fetch the cache-data branch. Refusing to run on an empty cache: rebuilding it takes about twelve fetch days."
            exit 1
          fi
          CACHE_BASE=$(git rev-parse FETCH_HEAD)
          echo "CACHE_BASE=$CACHE_BASE" >> "$GITHUB_ENV"
          git cat-file blob "$CACHE_BASE:weather_cache.csv.gz" > blast_outputs/weather_cache.csv.gz
          git cat-file blob "$CACHE_BASE:cache_version.txt" > blast_outputs/cache_version.txt
          echo "Restored $(git log -1 --format='%h %s' "$CACHE_BASE"): $(stat -c %s blast_outputs/weather_cache.csv.gz) bytes, schema $(cat blast_outputs/cache_version.txt)"

      - name: Install extra R packages
        run: |
          # curl is required: openmeteo_batch.R needs real HTTP status codes,
          # which jsonlite::fromJSON(url) cannot expose.
          pkgs <- c("data.table", "jsonlite", "curl", "terra")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      # send_email.py is executed by the offline suite in dry-run mode, so the
      # interpreter has to exist BEFORE the tests, not only at send time. The
      # 2026-09-28 email was sent and the step still failed, on a NameError in the
      # line after the send: nothing had ever run the script before the live run.
      - name: Ensure python3
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 --version

      # Offline regression tests: no network, no quota, a few seconds. Fails the
      # run before three hours of fetching are spent on broken code. terra is
      # attached inside the suite on purpose: terra::shift masks
      # data.table::shift, and that masking once turned every grid point into a
      # silent "empty" and produced a blank map with no error in the log.
      #
      # A MISSING file is a warning, not a failure: tests that fail should block
      # the run, but the absence of a test file should never stop the product.
      - name: Offline tests
        run: |
          if [ -f test_offline.R ]; then
            Rscript test_offline.R
          elif [ -f tests/test_offline.R ]; then
            Rscript tests/test_offline.R
          else
            echo "::warning::test_offline.R not found; skipping offline tests"
          fi

      # ASK THE ARCHIVE WHAT IT HAS. The last day fetched used to be pure
      # arithmetic, "UTC date minus 6", and when that day was not published yet
      # every cell west of 120 E landed a day short. probe_archive_edge.R requests
      # one western point, waits for the daily update if it has not landed, and
      # prints the newest day that is really there; both R scripts then use it.
      # If the probe cannot answer, they fall back to the arithmetic.
      - name: Resolve archive edge
        run: |
          DE=$(Rscript probe_archive_edge.R | sed -n 's/^EDGE=//p' | tail -n 1)
          case "$DE" in
            20[0-9][0-9]-[01][0-9]-[0-3][0-9])
              echo "BLAST_DATA_END=$DE" >> "$GITHUB_ENV"
              echo "Archive edge pinned: $DE" ;;
            *)
              echo "::warning title=Archive edge not probed::probe returned '$DE'; the scripts fall back to the arithmetic edge" ;;
          esac

      - name: Continental heatmaps
        run: Rscript run_blast_grid.R

      # Saved straight after the fetch, before the town table, so a failure further
      # down no longer costs the two hours of weather just fetched. One parentless
      # commit, force-pushed to cache-data and nowhere else.
      - name: Save weather cache
        run: |
          f=blast_outputs/weather_cache.csv.gz; v=blast_outputs/cache_version.txt
          if [ ! -s "$f" ] || [ ! -s "$v" ]; then
            echo "::error title=Weather cache not saved::$f or $v is missing or empty"
            exit 1
          fi
          new=$(stat -c %s "$f"); old=$(git cat-file -s "$CACHE_BASE:weather_cache.csv.gz")
          oldv=$(git cat-file blob "$CACHE_BASE:cache_version.txt" | tr -d '[:space:]'); newv=$(tr -d '[:space:]' < "$v")
          # On the same schema, a cache under half the size of the one restored is
          # far more likely a bug than progress. A schema bump legitimately starts
          # again from nothing, so it is exempt.
          if [ "$oldv" = "$newv" ] && [ "$new" -lt $((old / 2)) ]; then
            echo "::error title=Weather cache not saved::new cache is $new bytes against $old restored, same schema $newv. Refusing to replace it."
            exit 1
          fi
          blob=$(git hash-object -w "$f"); vblob=$(git hash-object -w "$v")
          tree=$(printf '100644 blob %s\tcache_version.txt\n100644 blob %s\tweather_cache.csv.gz\n' "$vblob" "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=github-actions@github.com commit-tree "$tree" -m "Weather cache ${BLAST_RUN_DATE} (${new} bytes, schema ${newv})")
          for i in 1 2 3; do git push --force origin "$commit:refs/heads/cache-data" && break || sleep $((i*10)); done
          if ! git ls-remote origin refs/heads/cache-data | grep -q "$commit"; then
            echo "::error title=Weather cache not saved::the push to cache-data did not land"
            exit 1
          fi
          echo "Saved cache as $commit ($new bytes)"

      - name: Site table and summary
        run: Rscript run_blast.R

      # Never let a missing optional file abort the step. `run:` uses bash -e, so
      # a `git add` on a path that does not exist used to abort before `git push`.
      # The weather cache is NOT in this list: see "Save weather cache".
      - name: Commit trends and run state
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          for f in fetch_failures.csv weighted_spend.csv town_trends.csv blastam_trends.csv \
                   run_log.csv map_stats.txt midweek_status.txt run_date.txt run_status.txt; do
            [ -f "blast_outputs/$f" ] && git add -f "blast_outputs/$f" || true
          done
          git add -u blast_outputs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Weekly run (trends + run state) ${BLAST_RUN_DATE}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            for i in 1 2 3; do git push && break || sleep $((i*10)); done
          fi

      # Email via a Python stdlib script rather than a JavaScript action: the
      # send-mail action broke when GitHub forced actions onto Node 24.
      - name: Email summary and heatmaps
        if: env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 send_email.py

      # Fallback copy of everything kept for 90 days, in case an email fails.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 90

      # FAIL LOUDLY, LAST. Everything above has already been committed, emailed
      # and uploaded; this step only decides the colour of the run. run_blast.R
      # writes run_status.txt with degraded=0/1 and the reasons (run_health.R);
      # a missing file, or one from another run date, means the town step never
      # finished. A red run makes GitHub notify the workflow's owner, on top of
      # the "[DEGRADED]" subject line. The 2026-09-07 run delivered 31 towns of
      # "no data" and the next two a map three weeks stale, and all three showed
      # a green tick.
      - name: Verdict
        if: always()
        run: |
          f=blast_outputs/run_status.txt
          if [ ! -f "$f" ]; then
            echo "::error title=Blast run did not finish::$f is missing: run_blast.R did not complete"
            exit 1
          fi
          cat "$f"
          if ! grep -q "^run_date=${BLAST_RUN_DATE}$" "$f"; then
            echo "::error title=Blast run did not finish::$f is from another run date"
            exit 1
          fi
          if grep -q '^degraded=1' "$f"; then
            echo "::error title=Degraded blast run::$(grep '^reasons=' "$f" | cut -d= -f2-)"
            exit 1
          fi
          w=$(grep '^warnings=' "$f" | cut -d= -f2-)
          if [ -n "$w" ]; then echo "::warning title=Blast run notes::$w"; fi
          echo "Healthy run."
