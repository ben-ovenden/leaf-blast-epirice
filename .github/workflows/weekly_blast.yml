name: Weekly leaf blast risk (Monday ~7am AET email)

# GitHub cron is UTC only, and eastern-Australia clocks shift an hour at daylight
# saving. Two schedules bracket the change and the gate job lets only the one
# matching the current offset proceed.
on:
  schedule:
    - cron: '30 20 * * 0'   # 06:30 Monday AEST (winter, UTC+10)
    - cron: '30 19 * * 0'   # 06:30 Monday AEDT (summer, UTC+11)
  workflow_dispatch:

permissions:
  contents: write

# Two runs must never write the weather cache at once. Without this a manual
# dispatch overlapping the cron gives two runs pushing the same file and one of
# them loses its fetches.
concurrency:
  group: blast-grid
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger; running."
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Match the schedule that fired against the current UTC offset rather
          # than against the local hour. GitHub cron routinely fires 5 to 30
          # minutes late, and the old hour check ("is it 06?") silently skipped
          # the entire week whenever a run started at 07:0x local.
          OFF=$(TZ=Australia/Sydney date +%z)     # +1000 (AEST) or +1100 (AEDT)
          SCHED='${{ github.event.schedule }}'
          echo "Offset $OFF, schedule '$SCHED'"
          if { [ "$OFF" = "+1000" ] && [ "$SCHED" = "30 20 * * 0" ]; } || \
             { [ "$OFF" = "+1100" ] && [ "$SCHED" = "30 19 * * 0" ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The other seasonal cron handles this offset."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

  blast:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # Must exceed GRID_MAX_MINUTES (200) plus GRID_RESERVE_MINUTES (25), so the
    # script's own graceful stop fires first and the run still saves and commits.
    # A hard job timeout here would lose the whole run.
    timeout-minutes: 240
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built,
    # so nothing spatial has to compile on the runner.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extra R packages
        run: |
          # curl is now required: openmeteo_batch.R needs real HTTP status codes,
          # which jsonlite::fromJSON(url) cannot expose.
          pkgs <- c("data.table", "jsonlite", "curl")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      # Offline regression tests: no network, no quota, a few seconds. Fails the
      # run before three hours of fetching are spent on broken code.
      - name: Offline tests
        run: Rscript tests/test_offline.R

      - name: Continental heatmaps
        run: Rscript run_blast_grid.R

      - name: Site table and summary
        run: Rscript run_blast.R

      - name: Set run date
        run: |
          RD=$(cat blast_outputs/run_date.txt 2>/dev/null || true)
          [ -z "$RD" ] && RD=$(TZ=Australia/Sydney date +%F)
          echo "RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "Using RUN_DATE=$RD"

      # Commit the cache FIRST, and never let a missing optional file abort the
      # step. `run:` uses bash -e, so a `git add` on a path that does not exist
      # used to abort before `git push`, losing the cache as well as the trends.
      - name: Commit cache and trends
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          for f in weather_cache.csv.gz weather_cache.csv fetch_failures.csv cache_version.txt; do
            [ -f "blast_outputs/$f" ] && git add -f "blast_outputs/$f" || true
          done
          for f in town_trends.csv blastam_trends.csv map_stats.txt midweek_status.txt; do
            [ -f "blast_outputs/$f" ] && git add -f "blast_outputs/$f" || true
          done
          git add -u blast_outputs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Weekly run (cache + trends) $(date +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            for i in 1 2 3; do git push && break || sleep $((i*10)); done
          fi

      # Email via a Python stdlib script rather than a JavaScript action: the
      # send-mail action broke when GitHub forced actions onto Node 24. The
      # script fails loudly if a secret or attachment is missing.
      - name: Email summary and heatmaps
        if: env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 send_email.py

      # Fallback copy of everything kept for 90 days, in case an email fails to
      # deliver. Runs even if an earlier step failed.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 90
