name: Weekly leaf blast risk

on:
  schedule:
    # 06:00 Monday AEST (UTC+10) = 20:00 Sunday UTC. Queensland sites stay on AEST
    # all year (no daylight saving), so this is 6am there every Monday.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blast:
    runs-on: ubuntu-latest
    # Job-level env so the email step's `if:` can read it (a step cannot read its
    # own step-level env in its own `if:`).
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built,
    # so nothing spatial has to compile on the runner.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extra R packages
        run: |
          pkgs <- c("data.table", "jsonlite")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      - name: Site table and summary
        run: Rscript run_blast.R

      - name: Continental heatmap
        run: Rscript run_blast_grid.R

      - name: Set run date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      # Email is REQUIRED: the heatmaps are delivered ONLY by email (they are not
      # committed to the repo). The run artifact below is a 90-day fallback copy.
      # This step needs repo secrets MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO; if any
      # is missing the step fails loudly rather than skipping silently. Placed
      # before the commit so a git problem cannot block delivery.
      - name: Email summary and heatmaps
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Blast risk summary ${{ env.RUN_DATE }}
          to: ${{ secrets.MAIL_TO }}
          from: WWAI Cereal Pathology - Blast Models <${{ secrets.MAIL_USERNAME }}>
          html_body: file://blast_outputs/blast_summary_latest.html
          body: file://blast_outputs/blast_summary_latest.txt
          attachments: blast_outputs/epirice_heatmap_${{ env.RUN_DATE }}.png,blast_outputs/blastam_heatmap_${{ env.RUN_DATE }}.png,blast_outputs/town_trends.csv,blast_outputs/blastam_trends.csv

      - name: Commit trends history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add -f blast_outputs/town_trends.csv blast_outputs/blastam_trends.csv blast_outputs/weather_cache.csv.gz
          git diff --staged --quiet || git commit -m "Weekly run (trends + weather cache) $(date +%F)"
          git push

      # Fallback copy of everything (including both heatmaps) kept for 90 days,
      # in case an email fails to deliver. Runs even if an earlier step failed.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 90
