name: Weekly leaf blast risk

on:
  schedule:
    # 06:00 Monday AEST (UTC+10) = 20:00 Sunday UTC. Queensland sites stay on AEST
    # all year (no daylight saving), so this is 6am there every Monday.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blast:
    runs-on: ubuntu-latest
    # Job-level env so the email step's `if:` can read it (a step cannot read its
    # own step-level env in its own `if:`).
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built,
    # so nothing spatial has to compile on the runner.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extra R packages
        run: |
          pkgs <- c("data.table", "jsonlite")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      - name: Site table and summary
        run: Rscript run_blast.R

      - name: Continental heatmap
        run: Rscript run_blast_grid.R

      - name: Set run date
        run: |
          RD=$(cat blast_outputs/run_date.txt 2>/dev/null || true)
          [ -z "$RD" ] && RD=$(date -u +%F)
          echo "RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "Using RUN_DATE=$RD"

      # Commit the cache and trends FIRST, so resolution progress is never lost
      # even if the email step later fails.
      - name: Commit trends history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git rm --cached -q blast_outputs/weather_cache.csv.gz 2>/dev/null || true
          git add -f blast_outputs/town_trends.csv blast_outputs/blastam_trends.csv blast_outputs/weather_cache.csv
          git diff --staged --quiet || git commit -m "Weekly run (trends + weather cache) $(date +%F)"
          git push

      # Send the email with a Python stdlib script (send_email.py) rather than a
      # JavaScript action: the send-mail action broke when GitHub forced actions
      # onto Node 24. The script fails loudly if a secret or attachment is missing.
      - name: Email summary and heatmaps
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 send_email.py

      # Fallback copy of everything (including both heatmaps) kept for 90 days,
      # in case an email fails to deliver. Runs even if an earlier step failed.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 90
