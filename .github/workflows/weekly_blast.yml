name: Weekly leaf blast risk (Monday ~7am AET email)

# GitHub cron is UTC only, and eastern-Australia clocks shift an hour at daylight
# saving. So two schedules bracket the change and the gate job below lets only the
# one landing at 06:30 local (AEST or AEDT) proceed. The run takes ~25 min, so the
# email arrives about 7am Monday, eastern-Australia time, all year.
on:
  schedule:
    - cron: '30 20 * * 0'   # 06:30 Monday AEST (winter, UTC+10)
    - cron: '30 19 * * 0'   # 06:30 Monday AEDT (summer, UTC+11)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap host-side gate: proceed only when it is ~06:30 in eastern Australia, so
  # exactly one of the two seasonal schedules runs each week (the other exits here).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger; running."
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$(TZ=Australia/Sydney date +%H)
          echo "Local eastern-Australia hour: $H"
          if [ "$H" = "06" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Off-hour (${H}:xx local); the other seasonal cron handles this."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

  blast:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # Daily fetch-capped run (~60 min at the default 1000-fetch cap). 90 leaves
    # headroom for slow archive days and the parallel retry.
    # Must exceed GRID_MAX_MINUTES (130) plus modelling, rendering, commit and
    # email, so the script's own wall-clock stop fires first and the run still
    # saves and commits. A hard job timeout here would lose the whole run.
    timeout-minutes: 170
    # Job-level env so the email step's `if:` can read it (a step cannot read its
    # own step-level env in its own `if:`).
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    # rocker/geospatial ships R with terra, sf and a matching GDAL already built,
    # so nothing spatial has to compile on the runner.
    container:
      image: rocker/geospatial:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extra R packages
        run: |
          pkgs <- c("data.table", "jsonlite")
          need <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      - name: Continental heatmap
        run: Rscript run_blast_grid.R

      - name: Site table and summary
        run: Rscript run_blast.R

      - name: Set run date
        run: |
          RD=$(cat blast_outputs/run_date.txt 2>/dev/null || true)
          [ -z "$RD" ] && RD=$(TZ=Australia/Sydney date +%F)
          echo "RUN_DATE=$RD" >> "$GITHUB_ENV"
          echo "Using RUN_DATE=$RD"

      # Commit the cache and trends FIRST, so resolution progress is never lost
      # even if the email step later fails.
      - name: Commit trends history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add -f blast_outputs/town_trends.csv blast_outputs/blastam_trends.csv
          for f in weather_cache.csv.gz weather_cache.csv; do [ -f "blast_outputs/$f" ] && git add -f "blast_outputs/$f"; done
          git add -u blast_outputs/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Weekly run (trends + weather cache) $(date +%F)"
          git push

      # Send the email with a Python stdlib script (send_email.py) rather than a
      # JavaScript action: the send-mail action broke when GitHub forced actions
      # onto Node 24. The script fails loudly if a secret or attachment is missing.
      - name: Email summary and heatmaps
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 send_email.py

      # Fallback copy of everything (including both heatmaps) kept for 90 days,
      # in case an email fails to deliver. Runs even if an earlier step failed.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-outputs
          path: blast_outputs/
          retention-days: 90
